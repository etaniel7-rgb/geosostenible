function cambiarFoto(direccion){
    if(!document.getElementById("fotoLocalidad")){
    return;
}

    const datos = zonas[zonaActual];

    fotoActual += direccion;

    

    if(fotoActual < 0){

        fotoActual = datos.fotos.length - 1;

    }

    if(fotoActual >= datos.fotos.length){

        fotoActual = 0;

    }

    document.getElementById(
        "fotoLocalidad"
    ).src = datos.fotos[fotoActual];

    document.getElementById(
        "infoLocalidad"
    ).innerHTML =
    datos.textos[fotoActual];

}

async function guardarPropuesta(lat,lng){
const correo =
document.getElementById("correo").value;

const { data: existente } =
await clienteSupabase
.from("propuestas")
.select("correo")
.eq("correo", correo);

if(existente && existente.length > 0){

alert(
"Ya existe una propuesta registrada con este correo."
);

return;

}    

const propuesta = {

id: Date.now(),

ods:
document.getElementById(
"ods"
).value,

nombre:
document.getElementById("nombre").value,

tipo:
document.getElementById(
"tipoParticipante"
).value,

institucion:
document.getElementById(
"institucion"
).value,

localidad:
document.getElementById(
"localidad"
).value,

correo:
document.getElementById("correo").value,

titulo:
document.getElementById("titulo").value,

categoria:
document.getElementById("categoria").value,

descripcion:
document.getElementById("descripcion").value,

lat,
lng,

fecha:
new Date().toLocaleDateString(),

hora:
new Date().toLocaleTimeString()

};

const { error } = await clienteSupabase.from('propuestas').insert([propuesta]);

if (error) {
    alert("Error al guardar en Supabase: " + error.message);
    return;
}

propuestas.push(propuesta);

crearMarcador(propuesta);

actualizarContador();

map.closePopup();

alert("¡Propuesta guardada con éxito!");

}

const popup = `

font-size:13px;

margin-bottom:10px;

<br><br>

<br><br>

📅 ${p.fecha}

<br><br>

📍 Lat:
${p.lat.toFixed(4)}

<br>

📍 Lon:
${p.lng.toFixed(4)}

${
admin ?

`

<br><br>

<button
onclick="
eliminarPropuesta(${p.id})
"
style="
background:#C8102E;
color:white;
border:none;
padding:8px;
border-radius:8px;
cursor:pointer;
">
🗑 Eliminar
</button>

`

:

""

}

`;

L.marker(
[p.lat,p.lng]
)
.addTo(map)
.bindPopup(popup);

}

function activarAdmin(){

const clave =
prompt(
"Ingrese contraseña administrador"
);

if(

//===================
// ELIMINAR (SUPABASE)
//===================
async function eliminarPropuesta(id){

if(!admin){

alert(
"Solo el administrador puede eliminar propuestas"
);

return;

}

if(
!confirm(
"¿Eliminar esta propuesta?"
)
){
return;
}

const { error } = await clienteSupabase.from('propuestas').delete().eq('id', id);

if (error) {
    alert("Error al eliminar en Supabase: " + error.message);
    return;
}

propuestas =
propuestas.filter(
p => p.id !== id
);

alert("Propuesta eliminada");

location.reload();

}

function abrirPropuesta(id){

const propuesta =
propuestas.find(
p => p.id === id
);

if (!propuesta) return;

const modal =
document.getElementById(
"modalPropuesta"
);

modal.innerHTML = `

<h2 style="
color:#C8102E;
margin-bottom:10px;
">
${propuesta.titulo}
</h2>

<p><b>Tipo:</b> ${propuesta.tipo || "-"}</p>

<p><b>Participante:</b> ${propuesta.nombre}</p>

<p><b>Institución:</b> ${propuesta.institucion || "-"}</p>

<p><b>Localidad:</b> ${propuesta.localidad || "-"}</p>

<b>${propuesta.categoria}</b>

<p><b>ODS:</b> ${propuesta.ods}</p>

<p><b>Fecha:</b> ${propuesta.fecha}</p>

<p><b>Hora:</b> ${propuesta.hora}</p>

<p>

<b>Descripción:</b>

<br><br>

${propuesta.descripcion}

</p>

<button
onclick="
document.getElementById(
'modalPropuesta'
).style.display='none'
"
>

❌ Cerrar

</button>

`;

modal.style.display="block";

}

menuPanel.style.display="none";
